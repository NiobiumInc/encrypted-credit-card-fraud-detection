# .github/workflows/compiler-tests.yml
#
# Public-repo compiler sanity check. Runs on the ephemeral GCP self-hosted
# runner group (gcp-ephemeral) so the on-prem Niobium cluster is never
# exposed to public-repo PRs. Adapted from fetch-by-similarity-submission's
# compiler-tests.yml (mirrors niobium-client's own); see
# https://github.com/NiobiumInc/gcp-github-runners
# (workflow-snippets/README.md) for onboarding + operational details, and
# this repo's docs/NIOBIUM_CLIENT_TRANSPORT.md for the record/replay
# integration.
#
# NOTE on --target: this repo's own harness (harness/run_submission.py) can
# start its own local transport server against $SDK (see build_shim() /
# start_transport_server() there) when NBCC_FHETCH_SERVER is unset — but ONLY
# when niobium-client/scripts/fog is absent. That script ships in the
# submodule's own source tree, so it is always present after checkout, and
# the harness then defaults to `fog submit` (real Fog credentials, which CI
# does not have) for any non-local --target. Pre-exporting NBCC_FHETCH_SERVER
# ourselves (below) is what makes the harness use our own local server instead
# of trying to submit a real Fog job.
#
# ===========================================================================
# HARD REQUIREMENT: NO nbcc / compiler output in the public Actions log.
# Public repos => Actions logs AND artifacts are world-readable, with no
# per-job privacy toggle. The transport server and the replay run both send
# stdout+stderr to /dev/null; this workflow surfaces ONLY the exit status
# (PASS / FAIL). Do NOT: echo compiler output, `set -x` around it, upload
# trace/io/dataset artifacts, or print the SDK version. (This repo's own
# README shows a full FOG transcript as a curated example — that is a
# manually-vetted developer demo, not a guarantee about what an automated
# replay might print on every commit, so the same blanket suppression policy
# applies here as in every other onboarded repo.)
# ===========================================================================
#
# Never use pull_request_target with a checkout of the PR head.

name: compiler-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: the job only needs to read the repo for checkout.
permissions:
  contents: read

concurrency:
  group: compiler-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-tests:
    name: Compiler tests (self-hosted, GCP)
    # No size label yet: this workload (an 82->128->64->2 tabular MLP; the
    # README's own --target FOG prerequisites cite ~6GB RAM) is far smaller
    # than FBS's, so the default gcp-ephemeral machine is the starting
    # assumption, not a measured number. Add a measured machine-type label
    # here if this run turns out to be memory-starved.
    runs-on: [self-hosted, gcp-ephemeral, "run-${{ github.run_id }}"]
    timeout-minutes: 60   # OpenFHE cold-build ~15 min + fraud record/replay round trip
    env:
      SDK: /mnt/niobium-sdk/sdk   # mounted RO at boot by runner-startup.sh
      PORT: "9443"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Pin branch SDK (lockstep changes only — .sdk-pin)
        # No-op without a .sdk-pin file at the consumer repo's root (path via
        # SDK_PIN_FILE when the workflow nests that checkout). With one, the named
        # sdk-branch-* release's tarball is fetched from the GCS mirror,
        # checksum-verified against its .sha256 sidecar, and BIND-MOUNTED over
        # the nightly SDK, so every later step -- including anything that
        # hardcodes the mount path -- sees the pin. A GITHUB_ENV write would
        # not do that: this job defines SDK as job-level env, which GITHUB_ENV
        # does not reliably override. The pin proves itself by mount identity
        # (the SDK path now IS the extracted tree) plus the SDK contract file;
        # the bundle's own VERSION is logged, not asserted -- the compiler
        # writes the version string there, not the tag. Hard-fails on main so
        # a pin cannot be merged.
        run: |
          set -e
          # SDK_PIN_FILE: where THIS workflow checked the consumer repo out. Default is
          # the workspace root; a workflow that nests the repo (fbs-consumer-check puts
          # niobium-client at fbs/submission/niobium-client) sets it in job env.
          PIN="${SDK_PIN_FILE:-.sdk-pin}"
          [ -f "$PIN" ] || { echo "no $PIN — nightly SDK"; exit 0; }
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::.sdk-pin must not exist on main — remove it in the merge"; exit 1
          fi
          TAG="$(tr -d ' \r\n' < "$PIN")"
          case "$TAG" in sdk-branch-*) ;; *) echo "::error::.sdk-pin must name an sdk-branch-* tag"; exit 1;; esac
          DEST="$RUNNER_TEMP/branch-sdk"; mkdir -p "$DEST"
          SRC="gs://github-runner-499901-sdk-branches/$TAG"
          # The compiler build takes 15-25 min on the happy path (up to 3 h if
          # it queues behind a running nightly) and its tarball lands in the
          # bucket as it finishes; a PR opened right after the dispatch waits
          # here instead of failing and asking for a rerun.
          for i in $(seq 1 60); do
            gcloud storage ls "$SRC/*.tar.*" >/dev/null 2>&1 && break
            [ "$i" -eq 1 ] && echo "$TAG not in the mirror yet -- waiting up to 30 min for the compiler build"
            sleep 30
          done
          gcloud storage cp "$SRC/*.tar.*" "$DEST/" --quiet \
            || { echo "::error::$TAG still not in the mirror after 30 min -- check the release-binary-sdk run on the compiler branch, and that the tag is exactly right"; exit 1; }
          # Two objects arrive: the tarball and its .sha256 sidecar. Name the
          # tarball explicitly (a bare *.tar.* glob would hand tar the sidecar
          # as a member to extract) and verify against the sidecar while it is here.
          TARBALL="$(find "$DEST" -maxdepth 1 -name '*.tar.*' ! -name '*.sha256' | head -1)"
          [ -n "$TARBALL" ] || { echo "::error::no tarball in $DEST"; exit 1; }
          ( cd "$DEST" && sha256sum -c ./*.sha256 ) || { echo "::error::checksum mismatch for $TAG"; exit 1; }
          tar -xf "$TARBALL" -C "$DEST"
          SDKDIR="$(dirname "$(find "$DEST" -maxdepth 2 -name bin -type d | head -1)")"
          [ -x "$SDKDIR/bin/nbcc_fhetch_replay" ] \
            || { echo "::error::$TAG has no bin/nbcc_fhetch_replay -- not an SDK bundle this job can use"; exit 1; }
          sudo mount --bind "$SDKDIR" "$SDK"
          [ "$(stat -c %d:%i "$SDK")" = "$(stat -c %d:%i "$SDKDIR")" ] \
            || { echo "::error::pin did not take: $SDK is not $SDKDIR after the bind mount"; exit 1; }
          # Bundle-to-tag binding, warning-level: the producers enforce it, but a
          # bundle whose VERSION does not even mention the tag's sha7 is worth a
          # word in the log. The selftest fixture carries the real sha7, so it does
          # not warn; only a bundle mirrored under an unrelated tag would.
          BUNDLE_VERSION="$(cat "$SDK/VERSION" 2>/dev/null || echo n/a)"
          grep -q "${TAG##*-}" <<< "$BUNDLE_VERSION" \
            || echo "::warning::bundle VERSION '$BUNDLE_VERSION' does not mention the tag's sha7 (${TAG##*-})"
          echo "pinned branch SDK: $TAG over $SDK (bundle VERSION: $BUNDLE_VERSION)"
      - name: Verify SDK is mounted (no version printed)
        run: |
          test -x "$SDK/bin/nbcc_fhetch_replay" || { echo "::error::SDK not mounted"; exit 1; }

      - name: Install build tooling
        run: |
          sudo apt-get update -qq
          # harness/*.py uses only the Python 3 standard library (see
          # requirements.txt) — no pip install needed here.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Build niobium-client + fraud-detection stages (release)
        # Public C++/OpenFHE output — OK to show; useful for diagnosing build breaks.
        run: ./scripts/build_task.sh

      - name: Map the SDK into the layout the transport server expects
        run: |
          # The server daemon --execs $NIOBIUM_COMPILER_ROOT/build/nbcc_fhetch_replay.
          # The SDK ships bin/ + lib/; bridge with a shim of symlinks (same
          # pattern as niobium-client's own compiler-tests.yml).
          SHIM="$RUNNER_TEMP/nbcc-root"
          mkdir -p "$SHIM/build"
          ln -sf "$SDK"/bin/* "$SHIM/build/"
          ln -sf "$SDK"/lib/* "$SHIM/build/"
          test -x "$SHIM/build/nbcc_fhetch_replay" || { echo "::error::SDK missing nbcc_fhetch_replay"; exit 1; }
          echo "NIOBIUM_COMPILER_ROOT=$SHIM" >> "$GITHUB_ENV"
          # The compiler (run server-side by the transport) needs the SDK device
          # specs for a non-trivial --target like FHE_SIM; without this it aborts
          # with "Cannot find devices directory".
          echo "NIOBIUM_SPEC_DIR=$SDK/share/niobium/devices" >> "$GITHUB_ENV"

      # fraud_server_sdk calls niobium::compiler().replay() UNCONDITIONALLY
      # (record-then-always-replay, see docs/NIOBIUM_CLIENT_TRANSPORT.md), so
      # for a non-local --target every row dispatches over the transport — the
      # server must already be up before the first harness call.
      - name: Start the transport server (background, output suppressed)
        run: |
          set +x
          CLIENT_ROOT="$GITHUB_WORKSPACE/niobium-client"
          SERVER_BIN="$CLIENT_ROOT/build/src/fhetch_transport/nbcc_fhetch_replay_server"
          COMPILER_BIN="$NIOBIUM_COMPILER_ROOT/build/nbcc_fhetch_replay"
          test -x "$SERVER_BIN" || { echo "::error::server binary not built: $SERVER_BIN"; exit 1; }

          ENV_FILE="$CLIENT_ROOT/build/niobium_client.env"
          [ -f "$ENV_FILE" ] && . "$ENV_FILE"
          : "${OPENFHE_LIB:=$CLIENT_ROOT/vendor/lib/openfhe/lib}"

          # The server is a niobium-client binary and needs the client's OpenFHE
          # on the loader path. But it spawns the compiler's replay binary as a
          # child for every request, and a child inherits this environment —
          # where an inherited search path takes precedence over the rpath the
          # replay binary uses to find the OpenFHE it was built against. The two
          # are independent builds, so it would load the client's instead, and
          # whenever the two differ that surfaces as an undefined symbol at
          # startup (the replay helper dies, the server then 500s).
          #
          # Clearing the path is not an option: the server and its children need
          # *different* paths, not no path. So give the child its own
          # environment — point --exec at a wrapper that swaps in the compiler's
          # loader path and execs the real binary.
          EXEC_WRAPPER="$RUNNER_TEMP/nbcc_fhetch_replay_exec_wrapper.sh"
          cat > "$EXEC_WRAPPER" <<WRAPPER
          #!/bin/bash
          # Generated by compiler-tests.yml — do not edit.
          export LD_LIBRARY_PATH="$NIOBIUM_COMPILER_ROOT/build"
          exec "$COMPILER_BIN" "\$@"
          WRAPPER
          chmod +x "$EXEC_WRAPPER"

          # Output kept out of the public log; PATH must include the compiler
          # root's build/ dir — the compiler's "secondary replay" step execs a
          # small `replay` helper binary by bare name, not full path (see
          # niobium-client/FBS compiler-tests.yml for the same note).
          LD_LIBRARY_PATH="$OPENFHE_LIB:$NIOBIUM_COMPILER_ROOT/build" \
            PATH="$NIOBIUM_COMPILER_ROOT/build:$PATH" \
            "$SERVER_BIN" --port "$PORT" --bind 127.0.0.1 --exec "$EXEC_WRAPPER" \
            >"$RUNNER_TEMP/fhetch_server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/fhetch_server.pid"

          # Wait for /healthz — no busy-wait, poll on a short sleep.
          ready=0
          for i in $(seq 1 50); do
            if curl -sf "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1; then
              ready=1
              break
            fi
            kill -0 "$(cat "$RUNNER_TEMP/fhetch_server.pid")" 2>/dev/null || { echo "::error::server exited before healthz"; exit 1; }
            sleep 0.2
          done
          [ "$ready" = "1" ] || { echo "::error::server did not become healthy"; exit 1; }

      # -O 3 (default): matches FBS's known-good replay opt level (this
      # harness takes the int form, not "O3" — see --help).
      # --target FHE_SIM (not FUNC_SIM_HW): FBS's compiler-tests.yml documents
      # FUNC_SIM_HW as broken specifically for SDK/NIOBIUM_DIST_BUILD builds —
      # this repo's fraud_server_sdk is built the same way, so the same
      # workaround is assumed here pending its own confirmation run.
      # Row 0 (single transaction, "size" positional = 0) mirrors FBS's
      # smallest-instance sanity check.
      - name: Run fraud-detection — record (hollow) + replay over transport (PASS/FAIL only, compiler output suppressed)
        run: |
          set +x
          export NBCC_FHETCH_SERVER="http://127.0.0.1:$PORT"
          rc=0
          python3 harness/run_submission.py 0 --target FHE_SIM -O 3 --skip-build \
            >"$RUNNER_TEMP/fraud-replay.log" 2>&1 || rc=1
          if [ $rc -eq 0 ]; then
            echo "compiler E2E: PASS"
          else
            echo "::error::compiler E2E FAILED (output suppressed by policy; reproduce locally)"
          fi
          exit $rc

      - name: Stop the transport server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/fhetch_server.pid" ]; then
            pid="$(cat "$RUNNER_TEMP/fhetch_server.pid")"
            kill -TERM "$pid" 2>/dev/null || true
            for i in 1 2 3 4 5; do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            kill -0 "$pid" 2>/dev/null && kill -KILL "$pid" 2>/dev/null || true
          fi
